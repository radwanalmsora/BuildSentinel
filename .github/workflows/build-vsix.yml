name: Build Visual Studio Extension

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/BuildSentinel/**'
      - '.github/workflows/build-vsix.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore Dependencies
        run: dotnet restore src/BuildSentinel/BuildSentinel.csproj

      - name: Build VSIX Package
        run: |
          msbuild src/BuildSentinel/BuildSentinel.csproj /t:Build /p:Configuration=Release /p:DeployExtension=false /p:CreateVsixContainer=true /p:TargetDir="${{ github.workspace }}\src\BuildSentinel\bin\Release\"

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuildSentinel-VSIX
          path: 'src/BuildSentinel/bin/Release/*.vsix'
          if-no-files-found: error
