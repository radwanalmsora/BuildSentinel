name: Build Visual Studio Extension

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/BuildSentinel/**'
      - '.github/workflows/build-vsix.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages (SDK-style)
        run: dotnet restore src/BuildSentinel/BuildSentinel.csproj

      - name: Build VSIX using MSBuild
        run: msbuild src/BuildSentinel/BuildSentinel.csproj /p:Configuration=Release /p:DeployExtension=false /p:CreateVsixContainer=true

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuildSentinel-VSIX
          path: '**/*.vsix'
          if-no-files-found: error
          
