name: Build Visual Studio Extension

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/BuildSentinel/**'
      - '.github/workflows/build-vsix.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore src/BuildSentinel/BuildSentinel.csproj

      - name: Build VSIX Package
        run: dotnet build src/BuildSentinel/BuildSentinel.csproj --configuration Release

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuildSentinel-VSIX
          path: src/BuildSentinel/bin/Release/*.vsix
          if-no-files-found: error
