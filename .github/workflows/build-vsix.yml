name: Build Visual Studio Extension

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/BuildSentinel/**'
      - '.github/workflows/build-vsix.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and Package VSIX
        run: msbuild src/BuildSentinel/BuildSentinel.csproj /restore /p:Configuration=Release /p:DeployExtension=false /p:CreateVsixContainer=true

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuildSentinel-VSIX
          path: src/BuildSentinel/bin/Release/*.vsix
          if-no-files-found: error
